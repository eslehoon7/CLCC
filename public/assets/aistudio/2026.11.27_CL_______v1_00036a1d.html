<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CL컨벤션 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 드마리스 관리자와 같은 어두운 업무 화면, 군더더기 없이 또렷하게
   IDEA: 숯빛 작업대 위에 금빛 포인트, 지금 볼 것만 밝게 떠오르는 화면
   PICTURE: 로그인 카드, 로그인 뒤에는 요약 숫자와 앨범 표
   COLOUR and TYPE: 숯빛 #121212 / 패널 #1a1a1a, 금빛 #b8895a 포인트, 경고 빨강, 맑은 고딕 13~14px 본문
   LAYOUT: 위쪽 머리줄 + 왼쪽 메뉴 + 본문, 760px 아래에서는 메뉴가 위로 */
:root{--bg:#121212;--panel:#1a1a1a;--panel2:#202020;--line:#2a2a2a;--ink:#ececec;--sub:#8f8f8f;
--gold:#b8895a;--gold2:#d6a877;--goldbg:rgba(184,137,90,.12);--err:#ff5a5a;--ok:#3fb27f;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Malgun Gothic","맑은 고딕","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;overflow-x:clip}
h1,h2{font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.3}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.hide{display:none!important}
.badge{display:inline-block;background:var(--gold);color:#1a1208;font-size:11px;font-weight:700;padding:4px 9px;border-radius:4px;letter-spacing:.04em}

/* 로그인 */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 400px at 50% 0%,rgba(184,137,90,.10),transparent 70%),var(--bg)}
.lcard{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 28px 26px}
.lcard h1{font-size:20px;margin:14px 0 4px}
.lcard .lead{color:var(--sub);margin:0 0 24px;font-size:13px}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px}
.field{margin-bottom:14px;position:relative}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg);font-size:16px}
.field input:focus{border-color:var(--gold);outline:none}
.eye{position:absolute;right:4px;bottom:4px;height:36px;padding:0 10px;border:0;background:none;color:var(--sub);font-size:12px}
.btn{height:44px;border:0;border-radius:8px;background:var(--gold);color:#1a1208;font-weight:700;width:100%;font-size:14px;margin-top:6px}
.btn:hover{background:var(--gold2)}
#loginErr{color:var(--err);font-size:13px;font-weight:500;min-height:20px;margin-top:12px;text-align:center}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
.lnote{margin-top:18px;font-size:12px;color:var(--sub);text-align:center}

/* 관리자 화면 */
#app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.head{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.head h1{font-size:17px;font-weight:500}
.head .sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;font-size:13px;text-decoration:none;border:0;background:none;color:var(--sub)}
.hbtn:hover{color:var(--ink)}
.hbtn.solid{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:700}
.body{display:grid;grid-template-columns:230px minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.side .cap{font-size:11px;color:var(--sub);letter-spacing:.08em;margin:0 6px 12px}
.nav{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:0;border-radius:8px;background:none;color:#bdbdbd;text-align:left;font-size:13px;width:100%}
.nav svg{width:16px;height:16px;flex:none}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--gold);color:#1a1208;font-weight:700}
.side .grow{flex:1;min-height:20px}
.note{border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;color:var(--sub);line-height:1.7}
.note b{display:block;color:var(--gold2);margin-bottom:4px}
.main{padding:28px clamp(16px,3vw,36px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:21px}
.top p{margin:4px 0 0;color:var(--sub);font-size:13px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.pill em{font-style:normal;color:var(--gold2)}
.pill em.warn{color:var(--err)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel)}
.tile:hover{border-color:var(--gold)}
.tile .ic{width:36px;height:36px;border-radius:8px;background:var(--goldbg);color:var(--gold2);display:grid;place-items:center;flex:none}
.tile strong{display:block;font-size:14px;margin-bottom:2px}
.tile span{font-size:12px;color:var(--sub);line-height:1.6}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel h2{font-size:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:13px 20px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--sub);font-weight:700;background:var(--panel2)}
td.n,th.n{text-align:right;white-space:nowrap}
td .id{color:var(--gold2);font-family:Consolas,monospace;font-size:12px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:#cfcfcf;background:var(--panel2)}
.small{font-size:12px;color:var(--sub);padding:12px 20px;border-top:1px solid var(--line);margin:0}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:44px 20px;text-align:center;color:var(--sub)}
.empty h2{color:var(--ink);font-size:16px;margin-bottom:6px}

/* 갤러리 업로드 */
.gwrap{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:24px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h2{font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 svg{color:var(--gold2)}
.card .desc{font-size:12px;color:var(--sub);margin:4px 0 18px}
.f{margin-bottom:14px}
.f .row{display:flex;justify-content:space-between;align-items:baseline}
.f .hint{font-size:11px;color:var(--gold2)}
.f select,.f input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg);font-size:14px;color:var(--ink)}
.f select:focus,.f input:focus{border-color:var(--gold);outline:none}
.drop{display:grid;place-items:center;text-align:center;gap:4px;border:1px dashed #3a3a3a;border-radius:10px;padding:22px 14px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--goldbg)}
.drop svg{color:var(--gold2)}
.drop b{font-size:13px}
.drop small{font-size:11px;color:var(--sub)}
.ferr{color:var(--err);font-size:12px;min-height:18px;margin-top:6px}
.picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.picks div{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#000}
.picks img{width:100%;height:100%;object-fit:cover;display:block}
.picks button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:22px;padding:0}
.picks span{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(0,0,0,.6);padding:1px 4px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbtn{margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gtop h2{font-size:17px}
.gtop small{font-size:12px;color:#7fa7d6}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:#bdbdbd;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1208;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#2a2328,#1d1a1c);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ph0{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;color:#6f6a6d;font-size:11px;font-family:Consolas,monospace;word-break:break-all}
.ph .ab{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:700;background:rgba(0,0,0,.72);color:#e6e6e6;padding:2px 7px;border-radius:3px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .new{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;background:var(--gold);color:#1a1208;padding:2px 7px;border-radius:3px}
.ph .del{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:6px;border:0;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.ph:hover .del,.ph .del:focus-visible{opacity:1}
.ph .del:hover{background:var(--err)}
.ph figcaption{position:absolute;left:0;right:0;top:0;padding:8px 44px 18px 10px;font-size:11px;color:#eee;background:linear-gradient(rgba(0,0,0,.6),transparent);opacity:0;transition:opacity .15s}
.ph:hover figcaption{opacity:1}
@media(hover:none){.ph .del{opacity:1}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:50}
.mbox{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.mbox h3{margin:0 0 6px;font-size:16px}
.mbox p{margin:0 0 18px;font-size:13px;color:var(--sub)}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.mbtns button{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:13px}
.mbtns .danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2a2a;border:1px solid var(--gold);color:var(--ink);padding:10px 18px;border-radius:8px;font-size:13px;z-index:60}
.demo{font-size:11px;color:var(--sub);margin-top:10px}
@media(max-width:1100px){.gwrap{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
 .body{grid-template-columns:minmax(0,1fr)}
 .side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px}
 .side .cap,.side .grow,.note{display:none}
 .nav{width:auto;height:40px;padding:0 12px}
 .head h1{font-size:15px}
}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td{display:flow-root;border:0;padding:3px 16px;padding-inline-start:calc(16px + 7em);text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--sub);font-size:12px}.stack td:empty{display:none}}
</style>
</head>
<body>

<section id="login" aria-label="관리자 로그인">
  <form class="lcard" id="loginForm" novalidate>

    <h1>CL컨벤션 관리자 로그인</h1>

</section>

<div id="app" class="hide">

      <button class="nav" data-go="links"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 14a4 4 0 005.6 0l3-3a4 4 0 00-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 00-5.6 0l-3 3a4 4 0 005.6 5.6l1-1"/></svg><span id="nLink">배너 링크 관리</span></button>

    </aside>
    <main class="main" id="view"></main>
  </div>
</div>

  if (now < lockUntil) { err.textContent = '로그인을 여러 번 실패했습니다. ' + Math.ceil((lockUntil-now)/1000) + '초 후 다시 시도해 주세요.'; return; }

};


const MAX = 10;
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }
function confirmBox(title,msg,ok){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><h3></h3><p></p><div class="mbtns"><button data-c>취소</button><button class="danger" data-o>삭제</button></div></div>`;
  m.querySelector('h3').textContent=title; m.querySelector('p').textContent=msg;
  m.querySelector('[data-c]').onclick=()=>m.remove();
  m.querySelector('[data-o]').onclick=()=>{m.remove();ok();};
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m); m.querySelector('[data-c]').focus();
}
function compress(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const k=Math.min(1,2000/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{ URL.revokeObjectURL(url); res(b?{blob:b,url:URL.createObjectURL(b),name:file.name}:{blob:file,url:URL.createObjectURL(file),name:file.name}); },'image/webp',0.85);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}
function renderGallery(v){
  v.innerHTML=`
  <div class="gwrap">
    <form class="card" id="gForm" novalidate>
      <h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>갤러리 사진 추가</h2>
      <p class="desc">홈페이지 갤러리(GALLERY) 페이지의 앨범에 사진을 올립니다.</p>
      <div class="f"><div class="row"><label for="gAlbum">앨범 선택</label><span class="hint">필수</span></div>
        <select id="gAlbum"><option value="">앨범을 선택하세요</option>${ALBUMS.map(a=>`<option value="${a[0]}">${esc(a[1])} (${acount(a[0])}장)</option>`).join('')}</select></div>
      <div class="f"><label for="gCap">사진 설명</label>
        <input type="text" id="gCap" placeholder="비워두면 '앨범 이름 · 번호'로 자동 입력됩니다" maxlength="40"></div>
      <div class="f"><div class="row"><label>사진 파일</label><span class="hint">한 번에 최대 ${MAX}장</span></div>
        <label class="drop" id="gDrop" tabindex="0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 9v6M9 12h6"/></svg>
          <b>컴퓨터에서 사진 선택 (최대 ${MAX}장)</b>
          <small>여기로 사진을 끌어다 놓아도 됩니다. 큰 사진은 자동으로 줄여서 올립니다.</small>
          <input type="file" id="gFile" accept="image/*" multiple hidden>
        </label>
        <div class="ferr" id="gErr" role="alert"></div>
        <div class="picks" id="gPicks"></div></div>
      <button class="btn gbtn" id="gBtn" type="submit">갤러리 사진 등록하기</button>
      <p class="demo">지금은 화면 미리보기입니다. 실제 저장은 Firebase 연결 후 작동합니다.</p>
    </form>
    <section>
      <div class="gtop"><h2>홈페이지 갤러리 등록 사진 (<span id="gCount">${PHOTOS.length}</span>장)</h2><small>삭제하면 홈페이지에서도 바로 사라집니다</small></div>
      <div class="chips" id="gChips"></div>
      <div class="grid" id="gGrid"></div>
    </section>
  </div>`;
  const file=$('#gFile'), drop=$('#gDrop'), gerr=$('#gErr');
  drop.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();} });
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); addFiles(e.dataTransfer.files); });
  file.addEventListener('change',()=>{ addFiles(file.files); file.value=''; });
  $('#gAlbum').addEventListener('change',()=>{ gerr.textContent=''; });
  $('#gForm').addEventListener('submit',e=>{
    e.preventDefault();
    const album=$('#gAlbum').value;
    if(!album){ gerr.textContent='앨범을 먼저 선택해 주세요.'; $('#gAlbum').focus(); return; }
    if(!picks.length){ gerr.textContent='올릴 사진을 선택해 주세요.'; return; }
    const cap=$('#gCap').value.trim(); let n=acount(album);
    const added=picks.map(p=>({id:'n'+Date.now()+Math.random(),album,cap:cap||`${aname(album)} · ${++n}`,file:p.name,src:p.url,isNew:true}));
    PHOTOS=[...added,...PHOTOS]; picks=[]; galFilter=album;
    toast(`${aname(album)}에 ${added.length}장을 등록했습니다.`);
    renderGallery(v); updateNav();
  });
  async function addFiles(list){
    gerr.textContent='';
    let files=[...list].filter(f=>f.type.startsWith('image/'));
    if(!files.length){ gerr.textContent='사진 파일만 올릴 수 있습니다.'; return; }
    const room=MAX-picks.length;
    if(room<=0){ gerr.textContent=`한 번에 최대 ${MAX}장까지 올릴 수 있습니다.`; return; }
    if(files.length>room){ gerr.textContent=`한 번에 최대 ${MAX}장까지 올릴 수 있어서 ${room}장만 추가했습니다.`; files=files.slice(0,room); }
    const out=(await Promise.all(files.map(compress))).filter(Boolean);
    picks=[...picks,...out]; drawPicks();
  }
  function drawPicks(){
    $('#gPicks').innerHTML=picks.map((p,i)=>`<div><img src="${p.url}" alt=""><button type="button" data-rm="${i}" aria-label="선택 취소">×</button><span>${esc(p.name)}</span></div>`).join('');
    $('#gPicks').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ picks.splice(+b.dataset.rm,1); drawPicks(); });
    $('#gBtn').textContent = picks.length ? `갤러리 사진 ${picks.length}장 등록하기` : '갤러리 사진 등록하기';
  }
  drawPicks(); drawGrid();
  function drawGrid(){
    const chips=[['all','전체',PHOTOS.length],...ALBUMS.map(a=>[a[0],a[1],acount(a[0])])];
    $('#gChips').innerHTML=chips.map(c=>`<button type="button" class="chip ${galFilter===c[0]?'on':''}" data-f="${c[0]}">${esc(c[1])} ${c[2]}</button>`).join('');
    $('#gChips').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ galFilter=b.dataset.f; drawGrid(); });
    const list=PHOTOS.filter(p=>galFilter==='all'||p.album===galFilter);
    $('#gGrid').innerHTML=list.length?list.map(p=>`<figure class="ph" style="margin:0">
      ${p.src?`<img src="${p.src}" alt="${esc(p.cap)}">`:`<div class="ph0">${esc(p.file)}</div>`}
      ${p.isNew?'<span class="new">NEW</span>':''}
      <figcaption>${esc(p.cap)}</figcaption>
      <span class="ab">${esc(aname(p.album))}</span>
      <button type="button" class="del" data-del="${p.id}" aria-label="${esc(p.cap)} 삭제"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </figure>`).join(''):'<p style="color:var(--sub)">이 앨범에는 아직 사진이 없습니다.</p>';
    $('#gGrid').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const ph=PHOTOS.find(x=>x.id===b.dataset.del);
      confirmBox('사진을 삭제할까요?',`"${ph.cap}" 사진을 삭제하면 홈페이지 갤러리에서도 사라집니다.`,()=>{
        PHOTOS=PHOTOS.filter(x=>x.id!==ph.id); $('#gCount').textContent=PHOTOS.length; toast('사진을 삭제했습니다.'); drawGrid(); updateNav();
      });
    });
  }
}
function updateNav(){ $('#nGal').textContent = `갤러리 업로드 (${PHOTOS.length})`; }
function go(page){
  document.querySelectorAll('.nav[data-go]').forEach(n => n.classList.toggle('on', n.dataset.go === page));
  const v = $('#view');
  const [t, d] = PAGES[page];
  if (page === 'gallery') { renderGallery(v); return; }
  {
    const pill = page === 'hero'
      ? `<div class="pill">등록된 사진: <em>${HERO} / 3장</em></div>`
      : `<div class="pill">연결된 링크: <em class="${LINKS<3?'warn':''}">${LINKS} / 3개</em></div>`;
    v.innerHTML = `<div class="top"><div><h1>${t}</h1><p>${d}</p></div><div class="pills">${pill}</div></div>
      <div class="empty"><h2>화면 준비 중입니다</h2><p>다음 단계에서 이 화면을 만듭니다.</p></div>`;
  }
}
if (store.get()) showApp(); else $('#uid').focus();
}
